    <script>
      function getCookie(cname) {
        var name = cname + "=";
        var decodedCookie = decodeURIComponent(document.cookie);
        var ca = decodedCookie.split(";");
        for (var i = 0; i < ca.length; i++) {
          var c = ca[i];
          while (c.charAt(0) == " ") {
            c = c.substring(1);
          }
          if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
          }
        }
        return "";
      }
      if (window.location == window.parent.location) {
        window.open("../", "_self");
      }
    </script>

      function formatDoc(sCmd, sValue) {
        if (validateMode()) {
          document.execCommand(sCmd, false, sValue);
          oDoc.focus();
        }
      }

      function validateMode() {
        if (!document.compForm.switchMode.checked) {
          return true;
        }
        oDoc.focus();
        return false;
      }

      function setDocMode(bToSource) {
        var oContent;
        if (bToSource) {
          oContent = document.createTextNode(oDoc.innerHTML);
          oDoc.innerHTML = "";
          var oPre = document.createElement("pre");
          oDoc.contentEditable = false;
          oPre.id = "sourceText";
          oPre.contentEditable = true;
          oPre.appendChild(oContent);
          oDoc.appendChild(oPre);
        } else {
          if (document.all) {
            oDoc.innerHTML = oDoc.innerText;
          } else {
            oContent = document.createRange();
            oContent.selectNodeContents(oDoc.firstChild);
            oDoc.innerHTML = oContent.toString();
          }
          oDoc.contentEditable = true;
        }
        oDoc.focus();
      }

      function printDoc() {
        if (!validateMode()) {

          document.getElementById("previewPost").innerHTML = unescape(
            decodeURIComponent(inHTML),
          );
          document.getElementById("previewPostTime").innerHTML =

          document.getElementById("previewPostId").innerHTML =

          document.getElementById("previewPostCreator").innerHTML = JSON.parse(

          );
          document.getElementById("avthumb").innerHTML =
            '<img src="' + prepostpre.AVPic + '" style="padding:4px;">';
          document.getElementById("previewPostTitle").innerHTML =
            prepostpre.TODTitle;
          document.getElementById("loaderTD").style.visibility = "hidden";
          document.getElementById("loaderTD").style.display = "none";
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
        } else {
          document.getElementById("loaderTD").style.visibility = "hidden";
        }
      }

      function getId(url) {
        var regExpYT =
          /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        var regExpVM = /^.*(vimeo.com\/)([^#\&\?]*).*/;
        var matchYT = url.match(regExpYT);
        var matchVM = url.match(regExpVM);

        if (matchYT && matchYT[2].length == 11) {
          return "https://www.youtube.com/embed/" + matchYT[2];
        } else if (matchVM) {
          return "https://player.vimeo.com/video/" + matchVM[2];
        } else {
          return "error";
        }
      }
    </script>

        var strongRegex = new RegExp(
          "^(?=.{8,})(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*\\W).*$",
          "g",
        );
        var mediumRegex = new RegExp(
          "^(?=.{7,})(((?=.*[A-Z])(?=.*[a-z]))|((?=.*[A-Z])(?=.*[0-9]))|((?=.*[a-z])(?=.*[0-9]))).*$",
          "g",
        );
        var enoughRegex = new RegExp("(?=.{4,}).*", "g");
        if (false == enoughRegex.test($(this).val())) {
          $("#passstrength").html("Too Short!");
          document.getElementById("confirmK").disabled = true;
          passstrength.style.display = "block";
        } else if (strongRegex.test($(this).val())) {
          $("#passstrength").className = "ok";
          document.getElementById("confirmK").disabled = false;
          $("#passstrength").html("Strong!");
        } else if (mediumRegex.test($(this).val())) {
          $("#passstrength").className = "alert";
          $("#passstrength").html("Medium!");
          document.getElementById("confirmK").disabled = false;
        } else {
          $("#passstrength").className = "error";
          $("#passstrength").html("Weak!");
          document.getElementById("confirmK").disabled = false;
        }
        return true;
      });

    <script>
      function readImage(input) {
        if (input.files && input.files[0]) {
          var FR = new FileReader();
          FR.onload = function (e) {
            $("#img").show().attr("src", e.target.result);
            $("#base").show().text(e.target.result);
          };
          FR.readAsDataURL(input.files[0]);
        }
      }

      $("#upload").change(function () {
        readImage(this);
      });
    </script>
    <script>
      $(document).ready(function () {
        $("input[type=file]").on("change", async function () {
          const files = this.files;
          readImage(this);
          if (files.length) {
            // Reject big files
            if (files[0].size > $(this).data("max-size") * 1024) {
              console.log("Please select a smaller file");
              return false;
            }

            document.getElementById("crImage").value = "uploading image...";
            const formData = new FormData();
            formData.append("image", files[0]);
            const apiUrl = "https://api.mastrowall.in/_file/image";
            try {
              const response = await fetch(apiUrl, {
                method: "POST",
                body: formData,
              });
              const result = await response.json();
              if (result.success) {
                var imageUrl = result.url;
                imageUrl = "https://api.mastrowall.in/_img/v/" + btoa(imageUrl);
                document.getElementById("crImage").value = imageUrl;
                document.getElementById("previewImg").style.display = "block";
                document.getElementById("radioS").style.display = "block";
                $("#previewImg")
                  .show()
                  .html(`<img src="${imageUrl}" width="100%" height="240px">`);
              } else {
                console.error("Upload failed:", result.message || result);
              }
            } catch (error) {
              document.getElementById("crImage").value =
                "Error uploading image";
              console.error("Error uploading image:", error);
            }
          }
        });
      });
    </script>
